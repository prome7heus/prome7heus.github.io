<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Video cu subtitrare</title>
<!--
  Usage: index.html#<youtube video id>   e.g. index.html#bQ3fAYLBSwQ
  Subtitles are read from <video id>.vtt (or <video id>.srt) next to this page.
  Optional: a Romanian title on the first line of the .vtt, after "WEBVTT - ".
  Must be opened from a web address (http/https), not as a local file:
  YouTube refuses to play embeds without one and browsers block reading the subtitle file.
-->
<style>
  :root {
    --bg: #111; --fg: #fff; --muted: #b9b9b9; --btn: #2a2a2a; --btn-on: #3d3d3d; --accent: #f5c542;
    --sub: 26px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  header { padding: 12px 16px 8px; }
  h1 { font-size: 19px; line-height: 1.3; margin: 0; font-weight: 600; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

  .stage { position: relative; background: #000; }
  .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 70dvh; background: #000; }
  .frame iframe, .frame #player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* Subtitle box: under the video in portrait, over the picture in landscape / full screen. */
  .subs { min-height: calc(var(--sub) * 1.35 * 3 + 24px); padding: 12px 16px;
    display: flex; align-items: center; justify-content: center; text-align: center; }
  .subs span { font-size: var(--sub); line-height: 1.35; font-weight: 600; text-wrap: balance; }

  .notice { margin: 8px 16px 0; padding: 12px 14px; border-radius: 12px; background: #3a2a10; color: #ffe2a8;
    font-size: 16px; line-height: 1.4; white-space: pre-line; }
  .notice:empty { display: none; }

  .controls { display: grid; grid-template-columns: 1.2fr 1fr; gap: 10px; padding: 8px 16px 6px; }
  .controls.small { grid-template-columns: 1fr 1fr 1fr; padding-top: 4px; }
  button { appearance: none; border: 0; border-radius: 14px; background: var(--btn); color: var(--fg);
    font: inherit; font-size: 19px; font-weight: 600; min-height: 60px; padding: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px; }
  button:active { background: var(--btn-on); }
  button:disabled { opacity: .45; }
  button.play { background: var(--accent); color: #111; font-size: 22px; }
  .controls.small button { min-height: 52px; font-size: 17px; }
  button[aria-pressed="false"] { color: var(--muted); }
  .time { text-align: center; color: var(--muted); font-size: 15px; padding: 6px 16px 18px; font-variant-numeric: tabular-nums; }

  /* Subtitles drawn over the picture (landscape and full screen). Taps go through to YouTube. */
  .overlay .subs { position: absolute; left: 0; right: 0; bottom: 56px; min-height: 0; pointer-events: none; padding: 0 6%; }
  .overlay .subs span { background: rgba(0,0,0,.72); border-radius: 8px; padding: 4px 12px;
    box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .overlay .subs span:empty { display: none; }

  @media (orientation: landscape) and (max-height: 600px) {
    header, .controls, .time, .notice { display: none; }
    body { justify-content: center; }
    .stage { height: 100dvh; }
    .frame { height: 100dvh; max-height: none; aspect-ratio: auto; }
    .subs { position: absolute; left: 0; right: 0; bottom: 56px; min-height: 0; pointer-events: none; padding: 0 8%; }
    .subs span { background: rgba(0,0,0,.72); border-radius: 8px; padding: 4px 12px;
      box-decoration-break: clone; -webkit-box-decoration-break: clone; font-size: calc(var(--sub) * .9); }
    .subs span:empty { display: none; }
  }

  /* Full screen (real, or filling the page where the phone/app refuses real full screen). */
  .fs-exit { display: none; }
  .stage.is-fs { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .stage.is-fs .frame { height: 100%; max-height: none; aspect-ratio: auto; }
  .stage.pseudo-fs { position: fixed; inset: 0; z-index: 10; height: 100dvh; }
  body:has(.pseudo-fs) { overflow: hidden; }
  .stage.is-fs .fs-exit { display: flex; position: absolute; z-index: 2; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
    min-height: 52px; padding: 8px 16px; font-size: 18px; background: rgba(40,40,40,.85); }
  .hidden-subs .subs span { visibility: hidden; }
</style>
</head>
<body>
  <header>
    <h1 id="title">Se încarcă…</h1>
    <p>Engleză, cu subtitrare în română</p>
  </header>

  <div class="stage">
    <div class="frame"><div id="player"></div></div>
    <div class="subs" aria-live="polite"><span id="sub"></span></div>
    <button id="fsExit" class="fs-exit">✕ Ieșire</button>
  </div>
  <div class="notice" id="notice"></div>

  <div class="controls">
    <button id="play" class="play" aria-label="Pornește" disabled>▶ Pornește</button>
    <button id="fs">⛶ Ecran complet</button>
  </div>
  <div class="controls small">
    <button id="smaller" aria-label="Text mai mic">A−</button>
    <button id="subsToggle" aria-pressed="true">Subtitrare</button>
    <button id="bigger" aria-label="Text mai mare">A+</button>
  </div>
  <div class="time" id="time">0:00 / 0:00</div>

<script>
const $ = (id) => document.getElementById(id);
const sub = $("sub"), playBtn = $("play"), timeEl = $("time"), notice = $("notice"), titleEl = $("title");
const stage = document.querySelector(".stage");

// Accept "#bQ3fAYLBSwQ" and also a pasted YouTube link after the "#".
function videoIdFromHash() {
  const h = decodeURIComponent(location.hash.slice(1)).trim();
  const m = h.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|^)([\w-]{11})(?:[?&#/]|$)/);
  return m ? m[1] : null;
}
const VID = videoIdFromHash();
window.addEventListener("hashchange", () => location.reload());

const store = {
  get(k, d) { try { const x = localStorage.getItem("ytsubs:" + VID + ":" + k); return x === null ? d : JSON.parse(x); } catch { return d; } },
  set(k, x) { try { localStorage.setItem("ytsubs:" + VID + ":" + k, JSON.stringify(x)); } catch {} },
  // settings shared by all videos
  gget(k, d) { try { const x = localStorage.getItem("ytsubs:" + k); return x === null ? d : JSON.parse(x); } catch { return d; } },
  gset(k, x) { try { localStorage.setItem("ytsubs:" + k, JSON.stringify(x)); } catch {} },
};
function setTitle(t) { if (t) { titleEl.textContent = t; document.title = t; } }
function say(msg) { notice.textContent = notice.textContent ? notice.textContent + "\n" + msg : msg; }

// --- subtitles: <id>.vtt or <id>.srt next to this page ---
let CUES = [], fileTitle = "";
function parseTime(t) {
  const p = t.trim().replace(",", ".").split(":").map(Number);
  return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1];
}
function parseSubs(text) {
  text = text.replace(/^﻿/, "").replace(/\r/g, "");
  const head = text.match(/^WEBVTT[ \t]+-?[ \t]*(.+)/);
  if (head) fileTitle = head[1].trim();
  const cues = [];
  for (const block of text.split(/\n{2,}/)) {
    const lines = block.split("\n");
    const at = lines.findIndex((l) => l.includes("-->"));
    if (at < 0) continue;
    const [a, b] = lines[at].split("-->");
    const t = lines.slice(at + 1).join("\n").replace(/<[^>]+>/g, "").trim();
    if (t) cues.push({ s: parseTime(a), e: parseTime(b.trim().split(/\s+/)[0]), t });
  }
  return cues.sort((x, y) => x.s - y.s);
}
async function loadSubs() {
  for (const ext of ["vtt", "srt"]) {
    try {
      const r = await fetch(`${VID}.${ext}`, { cache: "no-cache" });
      if (r.ok) { CUES = parseSubs(await r.text()); if (CUES.length) return true; }
    } catch {}
  }
  return false;
}

let last = -1;
function cueAt(t) {
  let lo = 0, hi = CUES.length - 1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (CUES[m].e < t) lo = m + 1; else if (CUES[m].s > t) hi = m - 1; else return m; }
  return -1;
}
function fmt(s) { s = Math.max(0, Math.floor(s || 0)); const m = Math.floor(s / 60); return m + ":" + String(s % 60).padStart(2, "0"); }

// --- YouTube player ---
let player = null, ready = false;
function now() { try { return player.getCurrentTime() || 0; } catch { return 0; } }
function playing() { try { return player.getPlayerState() === 1; } catch { return false; } }
function tick() {
  if (!ready) return;
  const t = now(), i = cueAt(t);
  if (i !== last) { last = i; sub.textContent = i >= 0 ? CUES[i].t : ""; }
  let d = 0; try { d = player.getDuration(); } catch {}
  timeEl.textContent = fmt(t) + " / " + fmt(d);
}
setInterval(tick, 100);

let lastSave = 0;
setInterval(() => {
  if (!ready || !playing()) return;
  const t = now();
  if (Math.abs(t - lastSave) > 5) { lastSave = t; store.set("pos", t); }
}, 1000);

function syncPlay() {
  const p = playing();
  playBtn.textContent = p ? "❚❚ Pauză" : "▶ Pornește";
  playBtn.setAttribute("aria-label", p ? "Pauză" : "Pornește");
}
playBtn.onclick = () => {
  if (!ready) return;
  if (playing()) player.pauseVideo();
  else { player.unMute(); player.setVolume(100); player.playVideo(); }
};

function startPlayer() {
  const pos = store.get("pos", 0);
  player = new YT.Player("player", {
    videoId: VID,
    host: "https://www.youtube-nocookie.com",
    playerVars: {
      playsinline: 1,      // iPhone: play inside the page so our subtitles stay visible
      fs: 0,               // YouTube's own full-screen button would hide our subtitles; we have our own
      rel: 0, iv_load_policy: 3, cc_load_policy: 0, hl: "ro",
      start: pos > 5 ? Math.floor(pos) : 0,
      origin: location.origin,
    },
    events: {
      onReady: () => {
        ready = true; playBtn.disabled = false;
        if (!fileTitle) { try { setTitle(player.getVideoData().title); } catch {} }
        tick();
      },
      onStateChange: (e) => {
        syncPlay();
        if (e.data === 1) {
          try { if (player.isMuted()) player.unMute(); } catch {}  // never stay silent
          // YouTube may switch on its own English captions (viewer preference); ours replace them.
          try { player.unloadModule("captions"); player.unloadModule("cc"); } catch {}
        }
        if (e.data === 0) store.set("pos", 0);
      },
      onError: (e) => {
        const why = { 2: "Codul videoclipului nu este valid.", 5: "Videoclipul nu poate fi redat aici.",
          100: "Videoclipul nu mai există sau este privat.", 101: "Autorul nu permite redarea pe alte pagini.",
          150: "Autorul nu permite redarea pe alte pagini.", 153: "YouTube cere ca pagina să fie deschisă de la o adresă web." }[e.data];
        say((why || "Videoclipul nu poate fi redat.") + ` (cod ${e.data})`);
      },
    },
  });
}

async function init() {
  if (!VID) {
    setTitle("Lipsește videoclipul");
    say("Adresa paginii trebuie să se termine cu # și codul videoclipului de pe YouTube, de exemplu: index.html#bQ3fAYLBSwQ");
    return;
  }
  if (location.protocol === "file:") {
    say("Pagina trebuie deschisă de la o adresă web (http:// sau https://), nu ca fișier. YouTube nu pornește videoclipul altfel, iar subtitrarea nu poate fi citită.");
  }
  const ok = await loadSubs();
  if (ok) setTitle(fileTitle);
  else if (location.protocol !== "file:") say(`Nu am găsit subtitrarea (${VID}.vtt). Videoclipul merge, dar fără text în română.`);
  window.onYouTubeIframeAPIReady = startPlayer;
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  s.onerror = () => say("YouTube nu se poate încărca. Verificați conexiunea la internet.");
  document.head.appendChild(s);
}

// --- subtitle on/off and size (remembered for all videos) ---
let subsOn = store.gget("subs", true);
const subsBtn = $("subsToggle");
function applySubs() {
  document.body.classList.toggle("hidden-subs", !subsOn);
  subsBtn.setAttribute("aria-pressed", String(subsOn));
  subsBtn.textContent = subsOn ? "Subtitrare: Da" : "Subtitrare: Nu";
}
subsBtn.onclick = () => { subsOn = !subsOn; store.gset("subs", subsOn); applySubs(); };

let size = store.gget("size", 26);
function applySize() { document.documentElement.style.setProperty("--sub", size + "px"); }
$("bigger").onclick = () => { size = Math.min(44, size + 3); store.gset("size", size); applySize(); };
$("smaller").onclick = () => { size = Math.max(17, size - 3); store.gset("size", size); applySize(); };

// --- full screen: the video + our subtitles together ---
// Where the browser/app refuses real full screen (e.g. iPhone), the video fills the page instead.
const fsBtn = $("fs");
let pseudoFs = false;
function fsElement() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
function enterFs() {
  const req = stage.requestFullscreen || stage.webkitRequestFullscreen;
  if (req && (document.fullscreenEnabled || document.webkitFullscreenEnabled)) {
    let p;
    try { p = req.call(stage); } catch (e) { p = Promise.reject(e); }
    Promise.resolve(p).then(() => screen.orientation?.lock?.("landscape").catch(() => {}), fallbackFs);
    // Some in-app viewers neither grant nor refuse the request; don't leave her tapping a dead button.
    setTimeout(() => { if (!fsElement() && !pseudoFs) fallbackFs(); }, 1000);
  } else fallbackFs();
}
function fallbackFs() { pseudoFs = true; syncFs(); }
function exitFs() {
  try { screen.orientation?.unlock?.(); } catch {}
  if (pseudoFs) { pseudoFs = false; syncFs(); }
  const exit = document.exitFullscreen || document.webkitExitFullscreen;
  if (fsElement() && exit) exit.call(document);
}
function syncFs() {
  const on = fsElement() === stage || pseudoFs;
  stage.classList.toggle("pseudo-fs", pseudoFs);
  stage.classList.toggle("is-fs", on);
  stage.classList.toggle("overlay", on);
  fsBtn.textContent = on ? "✕ Ieșire" : "⛶ Ecran complet";
}
fsBtn.onclick = () => (fsElement() || pseudoFs ? exitFs() : enterFs());
$("fsExit").onclick = exitFs;
document.addEventListener("fullscreenchange", syncFs);
document.addEventListener("webkitfullscreenchange", syncFs);

applySize(); applySubs(); syncPlay(); init();
</script>
</body>
</html>
